<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="main-container">
        <div class="navbar flex-vertical-center">
            <div class="logo">
                <span class="logo-light"><img src="assets/logo-dark-theme-DqM3kyac.svg" alt="logo" /></span>
                <span class="logo-dark"><img src="assets/logo-light-theme-CmDmyjmN.svg" alt="logo" /></span>
            </div>
            <div class="theme-icon flex-center">
                <div class="theme-icon-wrapper flex-center">
                    <span class=" dark-icon flex-center">
                        <svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' fill='none' viewBox='0 0 22 22'>
                            <g clip-path='url(#a)'>
                                <path stroke='#12131A' stroke-linecap='round' stroke-linejoin='round'
                                    stroke-width='1.98'
                                    d='M20.125 11.877A7.333 7.333 0 1 1 10.124 1.875a9.168 9.168 0 1 0 10 10.002Z' />
                            </g>
                            <defs>
                                <clipPath id='a'>
                                    <path fill='#fff' d='M0 0h22v22H0z' />
                                </clipPath>
                            </defs>
                        </svg>
                    </span>
                    <span class="light-icon flex-center">
                        <svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' fill='none' viewBox='0 0 22 22'>
                            <g clip-path='url(#a)'>
                                <path stroke='#fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.98'
                                    d='M11 1.833v1.834m0 14.666v1.834M3.666 11H1.833m3.955-5.212L4.49 4.492m11.72 1.296 1.297-1.296M5.788 16.215 4.49 17.512m11.72-1.296 1.297 1.296M20.166 11h-1.833m-2.75 0a4.583 4.583 0 1 1-9.167 0 4.583 4.583 0 0 1 9.167 0Z' />
                            </g>
                            <defs>
                                <clipPath id='a'>
                                    <path fill='#fff' d='M0 0h22v22H0z' />
                                </clipPath>
                            </defs>
                        </svg>
                    </span>
                </div>
            </div>
        </div>
    </header>
    <main class="main-container">
        <div class="flex-center"><h1 class=" app-title">Analyze your text in real-time.</h1>
        </div>
        <div>
            <textarea name="inputbox" id="inputbox" placeholder="Start typing here (or place your text)"
                class="main-input-textarea"></textarea>
        </div>


        <div class="sub-input flex-vertical-center input-wrapper">
            <div class=" input-right-section">
                <label class="flex-vertical-center">
                    <input type="checkbox">
                    Exclude Spaces
                </label>
               <div class="limit-wrapper flex-vertical-center"> <label class="flex-vertical-center">
                    <input type="checkbox">
                    Set Character Limit
                </label>
                <div class="input-limit"><input type="number">
                </div></div>
            </div>
            <div class="input-left-section">Approx. reading time:<span class="time-value"> 0 </span>minute</div>
        </div>

        <div class="banner-list flex-vertical-center">
            <div class="banner total-count">
                <span>00</span>
                <p>Total Characters</p>
            </div>
            <div class="banner word-count">
                <span id="wordCount">00</span>
                <p>Word Count</p>
            </div>
            <div class="banner sentence-count">
                <span id="sentenceCount">00</span>
                <p>Sentence Count</p>
            </div>
        </div>

        <div class="letter-density">Letter Density</div>
        <div class="density-list">
            <div class="density flex-vertical-center">
                <span class="letter">a</span><div class="progress-bar"><span></span></div>
            </div>
            <div class="density flex-vertical-center">
                <span>b</span><div class="progress-bar"><span></span></div>
            </div>
            <div class="density flex-vertical-center">
                <span>c</span><div class="progress-bar"><span></span></div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
